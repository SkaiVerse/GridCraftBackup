[package]
name = "gridcraft-ios"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "gridcraft_ios"
crate-type = ["staticlib"]

[dependencies]
gridcraft-engine = { workspace = true }
gridcraft-ui-egui = { workspace = true }
egui = { workspace = true }
egui-wgpu = { version = "0.37", default-features = false }
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }
pollster = "1"
serde_json = { workspace = true }
log = { workspace = true }
